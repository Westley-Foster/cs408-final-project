<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Thornestowne</title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <p>Placeholder text right here</p>

  <!-- Implemented sourcing a JavaScript file with ChatGPT (all the below code) -->
  <!-- ADD ITEM SECTION -->
  <div class="add-container">
    <h2>Add New Item to Database</h2>
    <form class="add-form" id="add-form">
      <div class="form-row">
        <label for="put-id">ID:</label>
        <input type="text" id="put-id" placeholder="Placeholder">
      </div>

      <div class="form-row">
        <label for="put-name">Name:</label>
        <input type="text" id="put-name" placeholder="Placeholder">
      </div>

      <div class="form-row">
        <label for="put-price">Price:</label>
        <input type="number" id="put-price" placeholder="Placeholder">
      </div>

      <button class="add-item" type="button" id="send-data">Add Item</button>
    </form>
  </div>

  <!-- LOAD BUTTON -->
  <div class="load-container">
    <button id="load-data">Load Items</button>
  </div>

  <!-- TABLE -->
  <table>
    <thead>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Price</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="lambda-info"></tbody>
  </table>

  <!-- DELETE SECTION -->
  <div class="delete-container">
    <h2>Delete Item</h2>
    <input id="delete-id" placeholder="Enter ID to delete">
    <button id="delete-data">Delete</button>
  </div>

  <script src="/js/inventory.js"></script>
</body>

</html>
